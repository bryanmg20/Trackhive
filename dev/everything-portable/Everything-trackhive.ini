; Everything portable for Trackhive development (HU-133): docs/everything-desarrollo.md
; Indexes only C:\trackhive\docs_simulados (no NTFS or ReFS volumes) and serves it
; over HTTP on 127.0.0.1:8081 with user and password, without file download.
; Use it with: everything.exe -instance trackhive -config <this file> -db <.db file>
[Everything]
app_data=0
run_as_admin=0
run_in_background=1
show_tray_icon=1
auto_include_fixed_volumes=0
auto_include_removable_volumes=0
auto_include_fixed_refs_volumes=0
auto_include_removable_refs_volumes=0
index_size=1
index_date_modified=1
index_folder_size=0
folders=C:\trackhive\docs_simulados
folder_monitor_changes=1
folder_rescan_if_full_list=1
folder_update_types=0
folder_update_days=0
folder_update_ats=0
folder_update_intervals=1
folder_update_interval_types=0
etp_server_enabled=0
http_server_enabled=1
http_server_bindings=127.0.0.1
http_server_port=8081
http_server_username=trackhive
http_server_password=trackhive-dev
http_server_allow_file_download=0
