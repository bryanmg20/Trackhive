# Locations of the site, shared by the HTTPS server (production) and the HTTP
# one (development). Included inside a server block.
root /usr/share/nginx/html;
index index.html;

# Shared by every proxied location below.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# API: proxy_pass without a URI keeps the full /api/v1/... path.
location /api/ {
    proxy_pass http://backend:3000;
}

# Everything agent (HU-166): closing a run updates the whole catalog, which
# can take longer than the default 60 s of nginx (D-24).
location /api/v1/everything/ {
    proxy_pass http://backend:3000;
    proxy_read_timeout 300s;
}

# Swagger UI and its OpenAPI JSON, both served by the backend.
location = /docs {
    proxy_pass http://backend:3000;
}

location /docs/ {
    proxy_pass http://backend:3000;
}

location = /docs-json {
    proxy_pass http://backend:3000;
}

location / {
    try_files $uri $uri/ /index.html;
}
