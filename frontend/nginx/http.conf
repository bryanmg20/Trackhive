# FRONTEND_TLS=off (40-trackhive-tls.sh): development, the first certificate
# of the server, or production behind a proxy of the university that serves
# HTTPS, redirects HTTP and sends HSTS (HU-42)
server {
    listen 80;
    server_name _;

    # HTTP-01 challenge of certbot --webroot, to get the first certificate
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    include /etc/nginx/snippets/trackhive-locations.conf;
}
