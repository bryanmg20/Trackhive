# Production (HU-42): HTTPS on 443 with the certificate of deploy/tls, and
# port 80 only redirects to HTTPS and answers the Let's Encrypt challenge.
# docs/manual-operacion.md, section 4.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # HTTP-01 challenge of certbot --webroot (deploy/acme-challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/acme-challenge;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Mounted read-only from TLS_CERT_DIR (deploy/tls by default)
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # One year, only for this host: the domain may belong to the university,
    # so its subdomains are not included
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/trackhive-locations.conf;
}
