"/><text x="376.16" y="530.64" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="24.840000000000003" font-weight="400" data-max-width="1433.6000000000001"><tspan x="376.16" y="555.48">Hace 15 minutos  |  125 archivos  |  Terminó correctamente</tspan></text><text x="376.16" y="601.2" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" data-max-width="1408"><tspan x="376.16" y="617.2">Al terminar una ejecución, actualizar antigüedad, cantidad, resultado y motivo si hubo error.</tspan></text><rect x="376.16" y="752.4000000000001" width="448" height="51.52" rx="26" fill="#F5C400" stroke="none"/><text x="394.16" y="764.4000000000001" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" data-max-width="412"><tspan x="394.16" y="781.4000000000001">Sincronizar ahora</tspan></text><text x="868.96" y="763.6" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" data-max-width="947.2"><tspan x="868.96" y="779.6">Sin ejecuciones anteriores: mostrar Sin sincronizaciones, sin inventar resultados.</tspan></text><rect x="348" y="870" width="473.6" height="274.40000000000003" rx="28" fill="#FFFFFF" stroke="none" filter="url(#card-shadow)"/><text x="370" y="884" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" data-max-width="429.6"><tspan x="370" y="905">Variante: en curso</tspan></text><path d="M370 925h429.6" stroke="#E6D9C5"/><text x="371.04" y="940.5600000000001" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" data-max-width="424.96000000000004"><tspan x="371.04" y="956.5600000000001">Ya hay una sincronización en curso. No se</tspan><tspan x="371.04" y="978.1600000000001">lanzará otra.</tspan></text><rect x="371.04" y="1066" width="424.96000000000004" height="51.52" rx="26" fill="#E9E5DE" stroke="#D8B477"/><text x="389.04" y="1078" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" data-max-width="388.96000000000004"><tspan x="389.04" y="1095">Sincronizando… [inactivo]</tspan></text><rect x="868.96" y="870" width="473.6" height="274.40000000000003" rx="28" fill="#FFFFFF" stroke="none" filter="url(#card-shadow)"/><text x="890.96" y="884" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" data-max-width="429.6"><tspan x="890.96" y="905">Variante: desactivada</tspan></text><path d="M890.96 925h429.6" stroke="#E6D9C5"/><text x="892" y="940.5600000000001" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" data-max-width="424.96000000000004"><tspan x="892" y="956.5600000000001">La integración con Everything está</tspan><tspan x="892" y="978.1600000000001">desactivada.</tspan></text><rect x="892" y="1066" width="424.96000000000004" height="51.52" rx="26" fill="#E9E5DE" stroke="#D8B477"/><text x="910" y="1078" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="500" data-max-width="388.96000000000004"><tspan x="910" y="1095">Sincronizar [inactivo]</tspan></text><rect x="1389.92" y="870" width="473.6" height="274.40000000000003" rx="28" fill="#FFFFFF" stroke="none" filter="url(#card-shadow)"/><text x="1411.92" y="884" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" data-max-width="429.6"><tspan x="1411.92" y="905">Variante: error</tspan></text><path d="M1411.92 925h429.6" stroke="#E6D9C5"/><text x="1412.96" y="940.5600000000001" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" data-max-width="424.96000000000004"><tspan x="1412.96" y="956.5600000000001">Terminó con error. Motivo: no fue posible</tspan><tspan x="1412.96" y="978.1600000000001">conectar con el servicio de búsqueda.</tspan></text><text x="1412.96" y="1066" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" data-max-width="424.96000000000004"><tspan x="1412.96" y="1082">Mostrar resultado nuevo; permitir otro</tspan><tspan x="1412.96" y="1103.6">intento cuando corresponda.</tspan></text><rect x="348" y="1230" width="1516" height="150" rx="22" fill="#ECE7DD" stroke="none"/><text x="372" y="1250" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" data-max-width="1462"><tspan x="372" y="1267">WF-14 · Sincronización con Everything · Borrador para revisión G6</tspan></text><text x="372" y="1284" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="400" data-max-width="1462"><tspan x="372" y="1298">ADMIN · /admin/sincronizacion (propuesta) · Propuesta · HU-138 · depende de HU-137</tspan></text><text x="372" y="1320" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" data-max-width="1462"><tspan x="372" y="1335">EVERYTHING_ENABLED=false deshabilita la acción. Variantes separadas; sin credenciales ni rutas internas.</tspan></text></svg>
