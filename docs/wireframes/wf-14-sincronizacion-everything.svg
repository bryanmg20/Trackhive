<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc"><title id="title">WF-14 Sincronización con Everything</title><desc id="desc">ADMIN. Propuesta · HU-138 · depende de HU-137. Boceto pendiente de revisión de G6.</desc><rect x="0" y="0" width="1280" height="1040" fill="#ffffff" stroke="#333"/><text x="32" y="20" font-family="Arial, sans-serif" font-size="25" fill="#222"><tspan x="32" dy="0" y="45">WF-14  /  Sincronización con Everything</tspan></text><text x="32" y="58" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="32" dy="0" y="73">ADMIN  |  /admin/sincronizacion (propuesta)  |  Propuesta · HU-138 · depende de HU-137</tspan></text><rect x="32" y="98" width="1216" height="54" fill="#eeeeee" stroke="#333"/><text x="50" y="112" font-family="Arial, sans-serif" font-size="20" fill="#222"><tspan x="50" dy="0" y="132">TRACKHIVE</tspan></text><text x="260" y="115" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="260" dy="0" y="131">Mi perfil | Material | Solicitudes | Calendario | Usuarios* | Sala* | Everything* | Salir</tspan></text><text x="48" y="182" font-family="Arial, sans-serif" font-size="22" fill="#222"><tspan x="48" dy="0" y="204">Sincronización con Everything</tspan></text><text x="48" y="225" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="240">Solo ADMIN. PERSONAL y PUBLICO no ven esta pantalla; el endpoint debe responderles 403 (HU-138).</tspan></text><rect x="48" y="285" width="1184" height="220" fill="#ffffff" stroke="#333"/><rect x="48" y="285" width="1184" height="44" fill="#eeeeee" stroke="#333"/><text x="64" y="295" font-family="Arial, sans-serif" font-size="18" fill="#222"><tspan x="64" dy="0" y="313">Última sincronización · ejemplo de ejecución correcta</tspan></text><text x="70" y="352" font-family="Arial, sans-serif" font-size="23" fill="#222"><tspan x="70" dy="0" y="375">Hace 15 minutos  |  125 archivos  |  Terminó correctamente</tspan></text><text x="70" y="415" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="70" dy="0" y="430">Al terminar una ejecución, actualizar antigüedad, cantidad, resultado y motivo si hubo error.</tspan></text><rect x="70" y="550" width="350" height="42" fill="#dedede" stroke="#333"/><text x="82" y="560" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="82" dy="0" y="576">Sincronizar ahora</tspan></text><text x="455" y="560" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="455" dy="0" y="575">Sin ejecuciones anteriores: mostrar Sin sincronizaciones, sin inventar</tspan><tspan x="455" dy="19.5">resultados.</tspan></text><rect x="48" y="655" width="370" height="245" fill="#ffffff" stroke="#333"/><rect x="48" y="655" width="370" height="44" fill="#eeeeee" stroke="#333"/><text x="64" y="665" font-family="Arial, sans-serif" font-size="18" fill="#222"><tspan x="64" dy="0" y="683">Variante: en curso</tspan></text><text x="66" y="718" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="66" dy="0" y="733">Ya hay una sincronización en curso.</tspan><tspan x="66" dy="19.5">No se lanzará otra.</tspan></text><rect x="66" y="830" width="332" height="42" fill="#ffffff" stroke="#333"/><text x="78" y="840" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="78" dy="0" y="856">Sincronizando… [inactivo]</tspan></text><rect x="455" y="655" width="370" height="245" fill="#ffffff" stroke="#333"/><rect x="455" y="655" width="370" height="44" fill="#eeeeee" stroke="#333"/><text x="471" y="665" font-family="Arial, sans-serif" font-size="18" fill="#222"><tspan x="471" dy="0" y="683">Variante: desactivada</tspan></text><text x="473" y="718" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="473" dy="0" y="733">La integración con Everything está</tspan><tspan x="473" dy="19.5">desactivada.</tspan></text><rect x="473" y="830" width="332" height="42" fill="#ffffff" stroke="#333"/><text x="485" y="840" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="485" dy="0" y="856">Sincronizar [inactivo]</tspan></text><rect x="862" y="655" width="370" height="245" fill="#ffffff" stroke="#333"/><rect x="862" y="655" width="370" height="44" fill="#eeeeee" stroke="#333"/><text x="878" y="665" font-family="Arial, sans-serif" font-size="18" fill="#222"><tspan x="878" dy="0" y="683">Variante: error</tspan></text><text x="880" y="718" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="880" dy="0" y="733">Terminó con error. Motivo: no fue</tspan><tspan x="880" dy="19.5">posible conectar con el servicio de</tspan><tspan x="880" dy="19.5">búsqueda.</tspan></text><text x="880" y="830" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="880" dy="0" y="845">Mostrar resultado nuevo; permitir</tspan><tspan x="880" dy="19.5">otro intento cuando corresponda.</tspan></text><rect x="32" y="944" width="1216" height="76" fill="#f3f3f3" stroke="#333" stroke-dasharray="5 4"/><text x="48" y="958" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="973">BORRADOR PARA REVISIÓN G6 · No implica aprobación ni implementación.</tspan></text><text x="48" y="986" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="1001">EVERYTHING_ENABLED=false deshabilita la acción. Variantes separadas; sin credenciales ni rutas internas.</tspan></text></svg>
