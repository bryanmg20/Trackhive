uentra en restauración. No mostrar comentarios internos.</tspan></text><rect x="770" y="825" width="130" height="42" fill="#ffffff" stroke="#333"/><text x="782" y="835" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="782" dy="0" y="851">&lt; Anterior</tspan></text><text x="921" y="835" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="921" dy="0" y="851">Página 1 de 3</tspan></text><rect x="1086" y="825" width="145" height="42" fill="#ffffff" stroke="#333"/><text x="1098" y="835" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="1098" dy="0" y="851">Siguiente &gt;</tspan></text><text x="48" y="890" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="905">Solo solicitudes propias. Lista vacía: buscar material para iniciar una solicitud.</tspan></text><rect x="32" y="944" width="1216" height="76" fill="#f3f3f3" stroke="#333" stroke-dasharray="5 4"/><text x="48" y="958" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="973">BORRADOR PARA REVISIÓN G6 · No implica aprobación ni implementación.</tspan></text><text x="48" y="986" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="1001">Móvil: una tarjeta por solicitud. Conservar filtros, estado legible y motivo de rechazo.</tspan></text></svg>
