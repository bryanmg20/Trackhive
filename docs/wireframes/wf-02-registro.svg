<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc"><title id="title">WF-02 Registro público</title><desc id="desc">Sin sesión. Existente · HU-73 integrada. Boceto pendiente de revisión de G6.</desc><rect x="0" y="0" width="1280" height="1040" fill="#ffffff" stroke="#333"/><text x="32" y="20" font-family="Arial, sans-serif" font-size="25" fill="#222"><tspan x="32" dy="0" y="45">WF-02  /  Registro público</tspan></text><text x="32" y="58" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="32" dy="0" y="73">Sin sesión  |  /registro  |  Existente · HU-73 integrada</tspan></text><rect x="32" y="98" width="1216" height="54" fill="#eeeeee" stroke="#333"/><text x="50" y="112" font-family="Arial, sans-serif" font-size="20" fill="#222"><tspan x="50" dy="0" y="132">TRACKHIVE</tspan></text><text x="260" y="115" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="260" dy="0" y="131">Inicio de sesión  |  Crear cuenta</tspan></text><text x="48" y="182" font-family="Arial, sans-serif" font-size="22" fill="#222"><tspan x="48" dy="0" y="204">Cree su cuenta</tspan></text><text x="48" y="220" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="235">* Obligatorio. Los datos de caracterización se guardan una sola vez.</tspan></text><text x="48" y="273" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="48" dy="0" y="289">Primer nombre *</tspan></text><rect x="48" y="299" width="270" height="42" fill="#fafafa" stroke="#333"/><text x="60" y="309" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="60" dy="0" y="325">Ana</tspan></text><text x="338" y="273" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="338" dy="0" y="289">Segundo nombre (opcional)</tspan></text><rect x="338" y="299" width="270" height="42" fill="#fafafa" stroke="#333"/><text x="350" y="309" font-family="Arial, sans-serif" fo