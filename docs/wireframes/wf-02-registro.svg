idth="570" height="44" fill="#eeeeee" stroke="#333"/><text x="678" y="283" font-family="Arial, sans-serif" font-size="18" fill="#222"><tspan x="678" dy="0" y="301">Datos de caracterización</tspan></text><text x="686" y="340" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="686" dy="0" y="356">Municipio o distrito *</tspan></text><rect x="686" y="366" width="522" height="42" fill="#fafafa" stroke="#333"/><text x="698" y="376" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="698" dy="0" y="392">Barranquilla</tspan></text><text x="686" y="434" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="686" dy="0" y="450">Rango de edad *</tspan></text><rect x="686" y="460" width="522" height="42" fill="#fafafa" stroke="#333"/><text x="698" y="470" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="698" dy="0" y="486">18–28</tspan></text><text x="1180" y="470" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="1180" dy="0" y="486">v</tspan></text><text x="686" y="528" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="686" dy="0" y="544">Grupo poblacional (opcional)</tspan></text><rect x="686" y="554" width="522" height="42" fill="#fafafa" stroke="#333"/><text x="698" y="564" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="698" dy="0" y="580">PREFIERO NO RESPONDER</tspan></text><text x="1180" y="564" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="1180" dy="0" y="580">v</tspan></text><text x="686" y="622" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="686" dy="0" y="637">Once opciones del formato del CLENA, en MAYÚSCULAS y</tspan><tspan x="686" dy="19.5">sin numeración. Puede quedar vacío.</tspan></text><text x="48" y="765" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="780">[ ] Acepto el aviso de privacidad.  [ Ver aviso completo y finalidad de los datos ]</tspan></text><rect x="48" y="825" width="270" height="42" fill="#dedede" stroke="#333"/><text x="60" y="835" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="60" dy="0" y="851">Crear cuenta</tspan></text><text x="350" y="837" font-family="Arial, sans-serif" font-size="17" fill="#222"><tspan x="350" dy="0" y="854">Ya tengo cuenta -&gt; WF-01</tspan></text><text x="48" y="886" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="901">Éxito: cuenta creada y acceso al login. Error: correo duplicado o validación junto al campo.</tspan></text><rect x="32" y="944" width="1216" height="76" fill="#f3f3f3" stroke="#333" stroke-dasharray="5 4"/><text x="48" y="958" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="973">BORRADOR PARA REVISIÓN G6 · No implica aprobación ni implementación.</tspan></text><text x="48" y="986" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="1001">Móvil: nombres y paneles apilados. El aviso comienza sin aceptar; no repetir datos al radicar.</tspan></text></svg>
