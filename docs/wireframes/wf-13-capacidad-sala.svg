<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc"><title id="title">WF-13 Capacidad de la sala</title><desc id="desc">ADMIN. Propuesta · HU-20.1. Boceto pendiente de revisión de G6.</desc><rect x="0" y="0" width="1280" height="1040" fill="#ffffff" stroke="#333"/><text x="32" y="20" font-family="Arial, sans-serif" font-size="25" fill="#222"><tspan x="32" dy="0" y="45">WF-13  /  Capacidad de la sala</tspan></text><text x="32" y="58" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="32" dy="0" y="73">ADMIN  |  /admin/capacidad-sala (propuesta)  |  Propuesta · HU-20.1</tspan></text><rect x="32" y="98" width="1216" height="54" fill="#eeeeee" stroke="#333"/><text x="50" y="112" font-family="Arial, sans-serif" font-size="20" fill="#222"><tspan x="50" dy="0" y="132">TRACKHIVE</tspan></text><text x="260" y="115" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="260" dy="0" y="131">Mi perfil | Material | Solicitudes | Calendario | Usuarios* | Sala* | Everything* | Salir</tspan></text><text x="180" y="185" font-family="Arial, sans-serif" font-size="22" fill="#222"><tspan x="180" dy="0" y="207">Capacidad diaria de la sala</tspan></text><rect x="180" y="280" width="920" height="400" fill="#ffffff" stroke="#333"/><rect x="180" y="280" width="920" height="44" fill="#eeeeee" stroke="#333"/><text x="196" y="290" font-family="Arial, sans-serif" font-size="18" fill="#222"><tspan x="196" dy="0" y="308">Configuración propuesta</tspan></text><text x="210" y="350" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="210" dy="0" y="365">Límite de citas por día de atención. El valor mostrado es un ejemplo, no una capacidad</tspan><tspan x="210" dy="19.5">aprobada.</tspan></text><text x="210" y="445" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="210" dy="0" y="461">Capacidad diaria * · entero positivo</tspan></text><rect x="210" y="471" width="860" height="42" fill="#fafafa" stroke="#333"/><text x="222" y="481" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="222" dy="0" y="497">20</tspan></text><rect x="210" y="560" width="290" height="42" fill="#dedede" stroke="#333"/><text x="222" y="570" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="222" dy="0" y="586">Guardar capacidad</tspan></text><rect x="530" y="560" width="330" height="42" fill="#ffffff" stroke="#333"/><text x="542" y="570" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="542" dy="0" y="586">Ver calendario WF-11</tspan></text><rect x="180" y="725" width="920" height="150" fill="#ffffff" stroke="#333"/><rect x="180" y="725" width="920" height="44" fill="#eeeeee" stroke="#333"/><text x="196" y="735" font-family="Arial, sans-serif" font-size="18" fill="#222"><tspan x="196" dy="0" y="753">Decisiones para G6</tspan></text><text x="210" y="785" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="210" dy="0" y="800">Confirmar capacidad, permisos y regla ante reservas existentes. El cambio no debe cancelar</tspan><tspan x="210" dy="19.5">citas silenciosamente.</tspan></text><rect x="32" y="944" width="1216" height="76" fill="#f3f3f3" stroke="#333" stroke-dasharray="5 4"/><text x="48" y="958" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="973">BORRADOR PARA REVISIÓN G6 · No implica aprobación ni implementación.</tspan></text><text x="48" y="986" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="1001">Móvil: una columna. Un mensaje explica validación y efecto del cambio; no implementar reglas no acordadas.</tspan></text></svg>
