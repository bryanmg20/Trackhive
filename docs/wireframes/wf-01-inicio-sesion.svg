<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1040" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc"><title id="title">WF-01 Inicio de sesión</title><desc id="desc">Sin sesión. Pantalla existente. Boceto pendiente de revisión de G6.</desc><rect x="0" y="0" width="1280" height="1040" fill="#ffffff" stroke="#333"/><text x="32" y="20" font-family="Arial, sans-serif" font-size="25" fill="#222"><tspan x="32" dy="0" y="45">WF-01  /  Inicio de sesión</tspan></text><text x="32" y="58" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="32" dy="0" y="73">Sin sesión  |  /login  |  Pantalla existente</tspan></text><rect x="32" y="98" width="1216" height="54" fill="#eeeeee" stroke="#333"/><text x="50" y="112" font-family="Arial, sans-serif" font-size="20" fill="#222"><tspan x="50" dy="0" y="132">TRACKHIVE</tspan></text><text x="260" y="115" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="260" dy="0" y="131">Inicio de sesión  |  Crear cuenta</tspan></text><rect x="350" y="205" width="580" height="600" fill="#ffffff" stroke="#333"/><rect x="350" y="205" width="580" height="44" fill="#eeeeee" stroke="#333"/><text x="366" y="215" font-family="Arial, sans-serif" font-size="18" fill="#222"><tspan x="366" dy="0" y="233">Acceso a Trackhive</tspan></text><text x="390" y="273" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="390" dy="0" y="288">Entre con el correo y la contraseña de su cuenta.</tspan></text><text x="390" y="330" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="390" dy="0" y="346">Correo electrónico *</tspan></text><rect x="390" y="356" width="500" height="42" fill="#fafafa" stroke="#333"/><text x="402" y="366" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="402" dy="0" y="382">persona@example.com</tspan></text><text x="390" y="425" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="390" dy="0" y="441">Contraseña *</tspan></text><rect x="390" y="451" width="500" height="42" fill="#fafafa" stroke="#333"/><text x="402" y="461" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="402" dy="0" y="477">********     [ Mostrar ]</tspan></text><rect x="390" y="520" width="500" height="70" fill="#eeeeee" stroke="#333"/><text x="405" y="537" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="405" dy="0" y="552">Variante de error: correo o contraseña incorrectos.</tspan><tspan x="405" dy="19.5">Conservar el correo escrito.</tspan></text><rect x="390" y="625" width="500" height="42" fill="#dedede" stroke="#333"/><text x="402" y="635" font-family="Arial, sans-serif" font-size="16" fill="#222"><tspan x="402" dy="0" y="651">Iniciar sesión</tspan></text><text x="390" y="700" font-family="Arial, sans-serif" font-size="17" fill="#222"><tspan x="390" dy="0" y="717">Crear cuenta -&gt; WF-02</tspan></text><text x="350" y="845" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="350" dy="0" y="860">Destino al entrar: PUBLICO -&gt; WF-04; PERSONAL / ADMIN -&gt; WF-09.</tspan></text><rect x="32" y="944" width="1216" height="76" fill="#f3f3f3" stroke="#333" stroke-dasharray="5 4"/><text x="48" y="958" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="973">BORRADOR PARA REVISIÓN G6 · No implica aprobación ni implementación.</tspan></text><text x="48" y="986" font-family="Arial, sans-serif" font-size="15" fill="#222"><tspan x="48" dy="0" y="1001">Móvil: tarjeta de una columna. Etiquetas visibles, foco y mensajes asociados al formulario.</tspan></text></svg>
