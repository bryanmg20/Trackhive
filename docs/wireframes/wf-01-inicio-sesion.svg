<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440" role="img" aria-labelledby="title desc"><title id="title">WF-01 Inicio de sesión</title><desc id="desc">Sin sesión. Pantalla existente. Identidad CLENA. Fotografías pendientes. Borrador sin validación G6.</desc><defs><style>@font-face{font-family:Inter;font-style:normal;font-weight:100 900;src:url('assets/InterVariable.woff2') format('woff2')}text{font-kerning:normal}</style><filter id="card-shadow" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#171717" flood-opacity="0.09"/></filter></defs><rect x="0" y="0" width="1920" height="1440" rx="0" fill="#F4F0E8" stroke="none"/><text x="64" y="36" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="800" data-max-width="160"><tspan x="64" y="76">CLENA</tspan></text><rect x="64" y="91" width="130" height="6" rx="3" fill="#F5C400" stroke="none"/><text x="240" y="39" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="400" data-max-width="240"><tspan x="240" y="57">Archivo Histórico</tspan><tspan x="240" y="81.3">del Atlántico</tspan></text><text x="1410" y="49" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" data-max-width="210"><tspan x="1410" y="67">Inicio de sesión</tspan></text><rect x="1635" y="32" width="220" height="54" rx="27" fill="#F5C400" stroke="none"/><text x="1670" y="47" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" data-max-width="170"><tspan x="1670" y="65">Crear cuenta</tspan></text><rect x="64" y="235" width="880" height="760" rx="30" fill="#E9DCC5" stroke="none"/><text x="105" y="295" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="800" data-max-width="780"><tspan x="105" y="343">La historia nos conecta.</tspan></text><text x="105" y="385" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="400" data-max-width="780"><tspan x="105" y="410">Consulte el patrimonio documental</tspan><tspan x="105" y="443.75">del Archivo Histórico del Atlántico.</tspan></text><rect x="105" y="535" width="795" height="365" rx="20" fill="#E7D7BC" stroke="#D8B477" stroke-dasharray="8 7"/><text x="125" y="693.5" fill="#65543C" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" data-max-width="755"><tspan x="125" y="706.5">FOTOGRAFÍA DE LA CIUDAD</tspan></text><text x="125" y="719.5" fill="#776650" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="400" data-max-width="755"><tspan x="125" y="731.5">Espacio reservado · imagen pendiente</tspan></text><rect x="1050" y="260" width="667" height="630" rx="28" fill="#FFFFFF" stroke="none" filter="url(#card-shadow)"/><text x="1072" y="274" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="600" data-max-width="623"><tspan x="1072" y="295">Acceso a CLENA</tspan></text><path d="M1072 315h623" stroke="#E6D9C5"/><text x="1096" y="331.4" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="400" data-max-width="575"><tspan x="1096" y="347.4">Entre con el correo y la contraseña de su cuenta.</tspan></text><text x="1096" y="391.25" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" data-max-width="575"><tspan x="1096" y="408.25">Correo electrónico *</tspan></text><rect x="1096" y="421.25" width="575" height="48" rx="15" fill="#FFFFFF" stroke="#D8B477"/><text x="1111" y="433.25" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="400" data-max-width="520"><tspan x="1111" y="450.25">persona@example.com</tspan></text><text x="1096" y="491" fill="#171717" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" data-max-width="575"><tspan x="1096" y="508">Contraseña *</tspan></text><rect x="1096" y="521" width="575" height="48" rx="15" fill="#FFFFFF" stroke="#D8B477"/