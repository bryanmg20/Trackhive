a HU-140</tspan></text><text x="372" y="1320" fill="#68635B" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="400" data-max-width="1462"><tspan x="372" y="1335">Son variantes de estado, no acciones simultáneas. Móvil: material y acciones apilados; rechazo con motivo.</tspan></text></svg>
