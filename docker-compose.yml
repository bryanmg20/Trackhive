services:
  postgres:
    networks:
      - trackhive-network
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Missing POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    networks:
      - trackhive-network
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Missing POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Missing POSTGRES_DB in .env}?schema=public
      RUN_SEED: ${RUN_SEED:?Missing RUN_SEED in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?Missing SEED_ADMIN_PASSWORD in .env}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Missing SEED_DEMO_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Missing JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Missing JWT_REFRESH_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:?Missing SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?Missing SMTP_PORT in .env}
      # Optional: Mailpit needs no login
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Missing SMTP_FROM in .env}
    ports:
      - "127.0.0.1:${BACKEND_PORT:?Missing BACKEND_PORT in .env}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Development mail server (D-10): keeps the emails without sending them.
  # Inbox at http://localhost:8025; the backend sends to mailpit:1025.
  mailpit:
    networks:
      - trackhive-network
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  frontend:
    networks:
      - trackhive-network
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:?Missing FRONTEND_PORT in .env}:80"
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  trackhive-network:
