# Production (HU-42): only the frontend publishes its ports (80 redirects to
# HTTPS on 443). PostgreSQL and the backend are reachable only inside the
# Docker network, and neither Mailpit nor the Everything mock start.
# In development, COMPOSE_FILE in .env adds docker-compose.dev.yml
# (docs/manual-operacion.md, section 2).
services:
  postgres:
    networks:
      - trackhive-network
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Missing POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Missing POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    networks:
      - trackhive-network
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:?Missing POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Missing POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?Missing POSTGRES_DB in .env}?schema=public
      # true only in development: also loads the fictitious demo data
      RUN_SEED: ${RUN_SEED:?Missing RUN_SEED in .env}
      # Initial administrator, created when the backend starts if there is no
      # ADMIN yet (HU-42). With RUN_SEED=false, at least 12 characters
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Missing ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Missing ADMIN_PASSWORD in .env}
      # Password of the demo accounts; only the seed uses it (RUN_SEED=true)
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?Missing JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Missing JWT_REFRESH_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:?Missing SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?Missing SMTP_PORT in .env}
      # Optional: Mailpit needs no login
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Missing SMTP_FROM in .env}
      # Sync with Everything (HU-137). The backend never calls Everything: the
      # agent (HU-166) sends it the pages with this token. Empty = disabled
      # (the ingest endpoints answer 503); docs/everything-desarrollo.md
      EVERYTHING_AGENT_TOKEN: ${EVERYTHING_AGENT_TOKEN:-}
      EVERYTHING_RUN_TIMEOUT_MINUTES: ${EVERYTHING_RUN_TIMEOUT_MINUTES:-30}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    networks:
      - trackhive-network
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      # on: HTTPS on 443 with the certificate of TLS_CERT_DIR and HSTS, and 80
      # only redirects. off: plain HTTP on 80, behind a proxy that serves HTTPS
      FRONTEND_TLS: ${FRONTEND_TLS:-on}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # fullchain.pem and privkey.pem (docs/manual-operacion.md, section 4)
      - ${TLS_CERT_DIR:-./deploy/tls}:/etc/nginx/tls:ro
      # Webroot of certbot, to renew the certificate
      - ./deploy/acme-challenge:/var/www/acme-challenge:ro
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  trackhive-network:
