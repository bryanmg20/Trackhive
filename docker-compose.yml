services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trackhive}
      POSTGRES_USER: ${POSTGRES_USER:-trackhive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackhive_local_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-trackhive}
      POSTGRES_USER: ${POSTGRES_USER:-trackhive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trackhive_local_only}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-change-this-admin-password}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-change-this-demo-password}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
