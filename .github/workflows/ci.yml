name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Isolated PostgreSQL of the e2e tests (D-21, HU-41): same version as
    # docker-compose, only for this job and empty on every run
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: trackhive_e2e
          POSTGRES_USER: trackhive
          POSTGRES_PASSWORD: trackhive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trackhive -d trackhive_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # test/setup/global-setup.ts applies the migrations to this database
      E2E_DATABASE_URL: postgresql://trackhive:trackhive@localhost:5432/trackhive_e2e?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint:check
      - name: Pruebas unitarias con cobertura (dominio y aplicación, mínimo 70 %)
        run: pnpm test:cov
      - name: Reporte de cobertura por capa
        if: ${{ !cancelled() }}
        run: pnpm coverage:report
      - name: Publicar reporte de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage
          retention-days: 14
          if-no-files-found: warn
      - name: Pruebas e2e (PostgreSQL de prueba aislado)
        run: pnpm test:e2e
      - run: pnpm build

  # Simulated documents and Everything mock (HU-133). On Linux and on Windows:
  # both must generate the same tree as dev/manifiesto.json, and the mock must
  # answer like the fixtures of the real Everything
  dev-everything:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r dev/requirements.txt
      - name: Generador, manifiesto y mock contra los fixtures de Everything real
        run: python -m unittest discover -s dev/tests -t dev/tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (incluye reglas de accesibilidad)
        run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Instalar navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Pruebas e2e de responsive (360 px)
        run: pnpm test:e2e
